name: Terraform Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Integration test
    env:
      TERRAFORM_PRE_RUN: |
        apt-get update
        apt-get install -y zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: terraform test
        uses: dflook/terraform-test@e239c64d00d5de45defc98d93ef5318adbc47f30 # v3.1.0
